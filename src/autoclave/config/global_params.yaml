# Parámetros globales del autoclave
pressure_lock_kpa: 250         # Presión de cierre de puerta (kPa)
vacuum_lock_kpa: 100           # Vacío de empaque (kPa)
max_close_time_s: 300          # Tiempo máximo de cierre (s)
max_open_time_s: 400           # Tiempo máximo de apertura (s)
atmospheric_pressure_kpa: 101  # Presión atmosférica (kPa)
jacket_drain_timeout_min: 60   # Tiempo agotado de chaqueta (min)
open_jacket_drain_s: 120       # Tiempo de apertura drenaje chaqueta (s)
print_rate_s: 10               # Tasa de impresión normal (s)
print_rate_sterilization_s: 30 # Tasa de impresión en esterilización (s)
cycle_counter_limit: 500       # Contador de ciclos (mantención)
time_counter_days: 365         # Contador de tiempo (mantención)
air_gap_kpa: 10                # Brecha de aire atmosférico (kPa)
safe_temperature_c: 90         # Temperatura segura (°C)
